{{- with .Get "source" }}
<blockquote class="quote-block">
  <div class="quote-body">{{ $.Page.RenderString (dict "display" "block") $.Inner }}</div>
  <footer class="quote-source">{{ . | markdownify }}</footer>
</blockquote>
{{- else }}
<blockquote>{{ $.Page.RenderString (dict "display" "block") $.Inner }}</blockquote>
{{- end }}

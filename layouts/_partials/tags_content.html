<div class="category-nav">
    {{- range $name, $taxonomy := site.Taxonomies.tags }}
    {{- with site.GetPage (printf "/tags/%s" $name) }}
    <a href="{{ .RelPermalink }}" class="category-btn">
        {{ .LinkTitle }} <sup>{{ $taxonomy.Count }}</sup>
    </a>
    {{- end }}
    {{- end }}
</div>

{{- range $index, $author := partial "author_data.html" (.Params.author | default site.Params.author) -}}
    {{- if $index }}, {{ end -}}
    {{- if $author.url -}}
        <a href="{{ $author.url | relURL }}">{{ $author.name }}</a>
    {{- else }}
        {{- $author.name -}}
    {{- end -}}
{{- end -}}
